[project]
name = "signlang"
version = "0.1.0"
description = "Real-time Indian Sign Language (ISL) and ASL translator (GPU accelerated, MediaPipe + PyTorch MLP)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mediapipe==0.10.21",
    "opencv-python>=4.8,<5",
    "numpy>=1.24,<2",
    "torch>=2.2",
    "rich>=13.0",
    "scikit-learn>=1.3",
]

[project.scripts]
signlang = "signlang.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

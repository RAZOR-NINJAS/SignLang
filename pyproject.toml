[project]
name = "signlang"
version = "0.1.0"
description = "Real-time ASL fingerspelling and word-sign translator (CPU-only, MediaPipe + small MLP)"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.21,<0.11",
    "opencv-python>=4.8,<5",
    "numpy>=1.24,<2",
    "torch>=2.2",
]

[project.scripts]
signlang = "signlang.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
